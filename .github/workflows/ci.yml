name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Biome linter
        run: npx biome check .

      - name: Run Biome formatter
        run: npx biome format .

      - name: Run TypeScript typecheck
        run: npx tsc

      - name: Validate plugins.json
        run: npm run validate:plugins

      - name: Run tests
        run: npm test

  install-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run install.sh against a throwaway HOME (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -y && sudo apt-get install -y jq
          elif ! command -v jq &>/dev/null; then
            brew install jq
          fi
          export CLAUDE_HOME="$RUNNER_TEMP/claude-home"
          export OPENCODE_HOME="$RUNNER_TEMP/opencode-home"
          bash dev/scripts/install.sh
          test -f "$CLAUDE_HOME/CLAUDE.md"
          test -f "$CLAUDE_HOME/settings.json"
          test -f "$CLAUDE_HOME/base_project/plugins.json"
          test -f "$CLAUDE_HOME/base_project/hooks/loop-detect.js"
          test -f "$CLAUDE_HOME/base_project/hooks/session-start-git-context.js"
          test -f "$CLAUDE_HOME/base_project/scripts/scan-skill.js"
          test -f "$CLAUDE_HOME/base_project/scripts/contrast-check.js"
          test -f "$CLAUDE_HOME/base_project/scripts/diary-source.js"
          test -f "$CLAUDE_HOME/base_project/hooks/usage-log.js"
          test -f "$CLAUDE_HOME/base_project/references/project-standards.md"
          test -f "$CLAUDE_HOME/base_project/references/command-menu.md"
          test -f "$CLAUDE_HOME/base_project/references/goal-types/build.md"
          test -f "$CLAUDE_HOME/base_project/references/goal-types/fix.md"
          test -f "$CLAUDE_HOME/base_project/references/goal-types/feature.md"
          test -f "$CLAUDE_HOME/base_project/references/goal-types/process.md"
          test -f "$CLAUDE_HOME/base_project/references/goal-types/research.md"
          test -f "$CLAUDE_HOME/agents/reviewer.md"
          test -f "$CLAUDE_HOME/commands/newproject.md"
          test -f "$CLAUDE_HOME/commands/scanproject.md"
          test -f "$CLAUDE_HOME/commands/fixproject.md"
          test -f "$CLAUDE_HOME/commands/cleanproject.md"
          test -f "$CLAUDE_HOME/commands/wpp.md"
          test -f "$CLAUDE_HOME/commands/status.md"
          test -f "$CLAUDE_HOME/commands/update.md"
          test -f "$CLAUDE_HOME/commands/uninstall.md"
          test -f "$CLAUDE_HOME/commands/bootstrap.md"
          test -f "$CLAUDE_HOME/commands/audit.md"
          test -f "$CLAUDE_HOME/commands/council.md"
          test -f "$CLAUDE_HOME/commands/plugins.md"
          test -f "$CLAUDE_HOME/commands/ship.md"
          test -f "$CLAUDE_HOME/commands/pr.md"
          test -f "$CLAUDE_HOME/commands/undo.md"
          test -f "$CLAUDE_HOME/commands/diario.md"
          test -f "$CLAUDE_HOME/commands/newgoal.md"
          test -f "$CLAUDE_HOME/commands/repertoire.md"
          test -f "$CLAUDE_HOME/commands/execgoals.md"
          test -f "$CLAUDE_HOME/commands/designreview.md"
          test -f "$CLAUDE_HOME/commands/reviewusage.md"
          test -f "$OPENCODE_HOME/opencode.jsonc"
          test -f "$OPENCODE_HOME/base_project/plugins.json"
          test -f "$OPENCODE_HOME/base_project/references/project-standards.md"
          test -f "$OPENCODE_HOME/base_project/references/goal-types/build.md"
          test -f "$OPENCODE_HOME/base_project/references/goal-types/fix.md"
          test -f "$OPENCODE_HOME/base_project/references/goal-types/feature.md"
          test -f "$OPENCODE_HOME/base_project/references/goal-types/process.md"
          test -f "$OPENCODE_HOME/base_project/references/goal-types/research.md"
          test -f "$OPENCODE_HOME/command/newproject.md"
          test -f "$OPENCODE_HOME/command/scanproject.md"
          test -f "$OPENCODE_HOME/command/fixproject.md"
          test -f "$OPENCODE_HOME/command/cleanproject.md"
          test -f "$OPENCODE_HOME/command/wpp.md"
          test -f "$OPENCODE_HOME/command/status.md"
          test -f "$OPENCODE_HOME/command/update.md"
          test -f "$OPENCODE_HOME/command/uninstall.md"
          test -f "$OPENCODE_HOME/command/bootstrap.md"
          test -f "$OPENCODE_HOME/command/audit.md"
          test -f "$OPENCODE_HOME/command/council.md"
          test -f "$OPENCODE_HOME/command/plugins.md"
          test -f "$OPENCODE_HOME/command/ship.md"
          test -f "$OPENCODE_HOME/command/pr.md"
          test -f "$OPENCODE_HOME/command/undo.md"
          test -f "$OPENCODE_HOME/command/diario.md"
          test -f "$OPENCODE_HOME/command/newgoal.md"
          test -f "$OPENCODE_HOME/command/repertoire.md"
          test -f "$OPENCODE_HOME/command/execgoals.md"
          test -f "$OPENCODE_HOME/command/designreview.md"
          test -f "$OPENCODE_HOME/command/reviewusage.md"
          node -e "JSON.parse(require('fs').readFileSync(process.env.CLAUDE_HOME + '/settings.json', 'utf8'))"
          echo "install.sh: all expected artifacts present and settings.json is valid JSON"

      - name: Run install.ps1 against a throwaway HOME (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $claudeHome = Join-Path $env:RUNNER_TEMP "claude-home"
          $opencodeHome = Join-Path $env:RUNNER_TEMP "opencode-home"
          & "dev\scripts\install.ps1" -ClaudeHome $claudeHome -OpencodeHome $opencodeHome
          $expected = @(
            (Join-Path $claudeHome "CLAUDE.md"),
            (Join-Path $claudeHome "settings.json"),
            (Join-Path $claudeHome "base_project\plugins.json"),
            (Join-Path $claudeHome "base_project\hooks\loop-detect.js"),
            (Join-Path $claudeHome "base_project\hooks\session-start-git-context.js"),
            (Join-Path $claudeHome "base_project\scripts\scan-skill.js"),
            (Join-Path $claudeHome "base_project\scripts\contrast-check.js"),
            (Join-Path $claudeHome "base_project\scripts\diary-source.js"),
            (Join-Path $claudeHome "base_project\hooks\usage-log.js"),
            (Join-Path $claudeHome "base_project\references\project-standards.md"),
            (Join-Path $claudeHome "base_project\references\command-menu.md"),
            (Join-Path $claudeHome "base_project\references\goal-types\build.md"),
            (Join-Path $claudeHome "base_project\references\goal-types\fix.md"),
            (Join-Path $claudeHome "base_project\references\goal-types\feature.md"),
            (Join-Path $claudeHome "base_project\references\goal-types\process.md"),
            (Join-Path $claudeHome "base_project\references\goal-types\research.md"),
            (Join-Path $claudeHome "agents\reviewer.md"),
            (Join-Path $claudeHome "commands\newproject.md"),
            (Join-Path $claudeHome "commands\scanproject.md"),
            (Join-Path $claudeHome "commands\fixproject.md"),
            (Join-Path $claudeHome "commands\cleanproject.md"),
            (Join-Path $claudeHome "commands\wpp.md"),
            (Join-Path $claudeHome "commands\status.md"),
            (Join-Path $claudeHome "commands\update.md"),
            (Join-Path $claudeHome "commands\uninstall.md"),
            (Join-Path $claudeHome "commands\bootstrap.md"),
            (Join-Path $claudeHome "commands\audit.md"),
            (Join-Path $claudeHome "commands\council.md"),
            (Join-Path $claudeHome "commands\plugins.md"),
            (Join-Path $claudeHome "commands\ship.md"),
            (Join-Path $claudeHome "commands\pr.md"),
            (Join-Path $claudeHome "commands\undo.md"),
            (Join-Path $claudeHome "commands\diario.md"),
            (Join-Path $claudeHome "commands\newgoal.md"),
            (Join-Path $claudeHome "commands\repertoire.md"),
            (Join-Path $claudeHome "commands\execgoals.md"),
            (Join-Path $claudeHome "commands\designreview.md"),
            (Join-Path $claudeHome "commands\reviewusage.md"),
            (Join-Path $opencodeHome "opencode.jsonc"),
            (Join-Path $opencodeHome "base_project\plugins.json"),
            (Join-Path $opencodeHome "base_project\references\project-standards.md"),
            (Join-Path $opencodeHome "base_project\references\goal-types\build.md"),
            (Join-Path $opencodeHome "base_project\references\goal-types\fix.md"),
            (Join-Path $opencodeHome "base_project\references\goal-types\feature.md"),
            (Join-Path $opencodeHome "base_project\references\goal-types\process.md"),
            (Join-Path $opencodeHome "base_project\references\goal-types\research.md"),
            (Join-Path $opencodeHome "command\newproject.md"),
            (Join-Path $opencodeHome "command\scanproject.md"),
            (Join-Path $opencodeHome "command\fixproject.md"),
            (Join-Path $opencodeHome "command\cleanproject.md"),
            (Join-Path $opencodeHome "command\wpp.md"),
            (Join-Path $opencodeHome "command\status.md"),
            (Join-Path $opencodeHome "command\update.md"),
            (Join-Path $opencodeHome "command\uninstall.md"),
            (Join-Path $opencodeHome "command\bootstrap.md"),
            (Join-Path $opencodeHome "command\audit.md"),
            (Join-Path $opencodeHome "command\council.md"),
            (Join-Path $opencodeHome "command\plugins.md"),
            (Join-Path $opencodeHome "command\ship.md"),
            (Join-Path $opencodeHome "command\pr.md"),
            (Join-Path $opencodeHome "command\undo.md"),
            (Join-Path $opencodeHome "command\diario.md"),
            (Join-Path $opencodeHome "command\newgoal.md"),
            (Join-Path $opencodeHome "command\repertoire.md"),
            (Join-Path $opencodeHome "command\execgoals.md"),
            (Join-Path $opencodeHome "command\designreview.md"),
            (Join-Path $opencodeHome "command\reviewusage.md")
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) { throw "Missing expected artifact: $path" }
          }
          Get-Content (Join-Path $claudeHome "settings.json") -Raw | ConvertFrom-Json | Out-Null
          Write-Output "install.ps1: all expected artifacts present and settings.json is valid JSON"

      - name: Re-run installer to confirm it's idempotent (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          export CLAUDE_HOME="$RUNNER_TEMP/claude-home"
          export OPENCODE_HOME="$RUNNER_TEMP/opencode-home"
          bash dev/scripts/install.sh
          echo "second run succeeded without error"

      - name: Re-run installer to confirm it's idempotent (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $claudeHome = Join-Path $env:RUNNER_TEMP "claude-home"
          $opencodeHome = Join-Path $env:RUNNER_TEMP "opencode-home"
          & "dev\scripts\install.ps1" -ClaudeHome $claudeHome -OpencodeHome $opencodeHome
          Write-Output "second run succeeded without error"